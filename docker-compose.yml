services:
  # Service 1: PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php_app
    restart: unless-stopped
    environment:
      DB_HOST: db              # Merujuk ke nama service mysql di bawah
      DB_DATABASE: crud_db
      DB_USERNAME: user
      DB_PASSWORD: userpassword
    volumes:
      - .:/var/www/html
    networks:
      - app-network
    depends_on:
      - db

  # Service 2: Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: nginx_webserver
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # Service 3: MySQL Database
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crud_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - dbdata:/var/lib/mysql
      # Otomatis mengeksekusi skema database.sql saat kontainer pertama kali dibuat
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql 
    ports:
      - "3306:3306"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
